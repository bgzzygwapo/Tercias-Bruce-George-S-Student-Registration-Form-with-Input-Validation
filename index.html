<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Seminar Registration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <h1>IT Seminar Registration</h1>
    <p class="intro">Fill in every field. Your details are checked in your browser only.</p>

    <form id="registrationForm" novalidate>
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" required autocomplete="name"
               aria-describedby="fullNameError" aria-invalid="false">
        <p id="fullNameError" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="studentNumber">Student number</label>
        <input type="text" id="studentNumber" name="studentNumber" required
               placeholder="24-1234-123" pattern="\d{2}-\d{4}-\d{3}"
               aria-describedby="studentNumberError" aria-invalid="false">
        <p id="studentNumberError" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="email"
               aria-describedby="emailError" aria-invalid="false">
        <p id="emailError" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="mobileNumber">Mobile number</label>
        <input type="tel" id="mobileNumber" name="mobileNumber" required
               placeholder="09171234567" pattern="(09\d{9}|\+639\d{9})" autocomplete="tel"
               aria-describedby="mobileNumberError" aria-invalid="false">
        <p id="mobileNumberError" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8"
               autocomplete="new-password"
               aria-describedby="passwordFeedback passwordError" aria-invalid="false">
        <p id="passwordFeedback" class="feedback" aria-live="polite"></p>
        <p id="passwordError" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required
               autocomplete="new-password"
               aria-describedby="confirmPasswordError" aria-invalid="false">
        <p id="confirmPasswordError" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="course">Course</label>
        <select id="course" name="course" required
                aria-describedby="courseError" aria-invalid="false">
          <option value="" selected>Select your course</option>
          <option value="BSIT">BSIT</option>
          <option value="BSCS">BSCS</option>
        </select>
        <p id="courseError" class="error" aria-live="polite"></p>
      </div>

      <div class="field checkbox">
        <input type="checkbox" id="terms" name="terms" required
               aria-describedby="termsError" aria-invalid="false">
        <label for="terms">I agree to the terms and conditions</label>
        <p id="termsError" class="error" aria-live="polite"></p>
      </div>

      <div class="actions">
        <button type="submit" id="registerBtn">Register</button>
        <button type="reset" id="resetBtn">Reset</button>
      </div>
    </form>

    <p id="successMessage" class="success" role="status" hidden></p>

    <section id="registrationSummary" class="summary" aria-live="polite" hidden>
      <h2>Registration summary</h2>
      <dl>
        <dt>Full name</dt><dd id="summaryName"></dd>
        <dt>Student number</dt><dd id="summaryStudentNumber"></dd>
        <dt>Email address</dt><dd id="summaryEmail"></dd>
        <dt>Mobile number</dt><dd id="summaryMobileNumber"></dd>
        <dt>Course</dt><dd id="summaryCourse"></dd>
      </dl>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
